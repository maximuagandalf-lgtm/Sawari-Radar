version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sawari-radar-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sawari_radar_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/src/db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sawari_radar_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
